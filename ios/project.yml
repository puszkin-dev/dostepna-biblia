name: dostepna biblia
options:
  developmentLanguage: pl
  deploymentTarget:
    iOS: "17.0"
fileGroups:
  - Info.plist
  - InfoTests.plist
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.8.8
configFiles:
  Debug: Build.xcconfig
  Release: Build.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9N975WV782
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: InfoTests.plist
targets:
  dostepna biblia:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_MODULE_NAME: DostepnaBiblia
        PRODUCT_BUNDLE_IDENTIFIER: com.dostepna.biblia
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: dostępna biblia
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          VALIDATE_PRODUCT: YES
  dostepna biblia - testy:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: dostepna biblia
    settings:
      PRODUCT_MODULE_NAME: DostepnaBibliaTests
      PRODUCT_BUNDLE_IDENTIFIER: com.dostepna.biblia.tests
  dostepna biblia - testy interfejsu:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: dostepna biblia
    settings:
      SWIFT_OBJC_BRIDGING_HEADER: UITests/Gesty.h
      PRODUCT_MODULE_NAME: DostepnaBibliaUITests
      PRODUCT_BUNDLE_IDENTIFIER: com.dostepna.biblia.uitests
schemes:
  dostepna biblia:
    build:
      targets:
        dostepna biblia: all
    test:
      targets: [dostepna biblia - testy, dostepna biblia - testy interfejsu]
